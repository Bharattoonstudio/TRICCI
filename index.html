<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var u = new URL(location.href);
          if (u.searchParams.has('airoShareToken')) {
            u.searchParams.delete('airoShareToken');
            history.replaceState(null, '', u.toString());
          }
        } catch (e) {}
      })();
    </script>
    <meta name="referrer" content="no-referrer-when-downgrade" />
    <!-- CSP via meta tag — CDN layer overrides HTTP headers so this is the only reliable way -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://checkout.razorpay.com https://cdn.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://checkout.razorpay.com; font-src 'self' https://fonts.gstatic.com data:; img-src * data: blob:; media-src * blob:; connect-src 'self' wss: https://*.airoapp.ai https://*.c35.airoapp.ai https://api.razorpay.com https://lumberjack.razorpay.com https://*.razorpay.com; frame-src https://api.razorpay.com https://*.razorpay.com; form-action 'self'; base-uri 'self';" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--app-head-->
    <script src="/airo-video-slots.js"></script>
    <script src="/airo-logo-orientation.js"></script>
  </head>
  <body class="fs-unmask-airo-app-builder">
    <div id="app" class="fs-unmask-airo-app-builder"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/analytics.js"></script>
  </body>
</html>
