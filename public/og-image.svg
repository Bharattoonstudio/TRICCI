<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A0A00"/>
      <stop offset="100%" stop-color="#2A1200"/>
    </linearGradient>
    <radialGradient id="glow" cx="900" cy="120" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1A0A00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FFD035"/>
      <stop offset="100%" stop-color="#35C9FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g stroke="#FF6B35" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Watermark -->
  <text x="600" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="260" font-weight="900" fill="#FFFFFF" fill-opacity="0.025" letter-spacing="-8">TRICCI</text>

  <!-- Accent circles -->
  <circle cx="1100" cy="80" r="180" fill="#FF6B35" fill-opacity="0.07"/>
  <circle cx="1100" cy="80" r="100" fill="#FFD035" fill-opacity="0.05"/>

  <!-- Tag pill -->
  <rect x="80" y="190" width="220" height="36" rx="18" fill="#FF6B35" fill-opacity="0.15"/>
  <rect x="80" y="190" width="220" height="36" rx="18" fill="none" stroke="#FF6B35" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="96" y="213" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#FF6B35" letter-spacing="2">RECRUITMENT PLATFORM</text>

  <!-- Main headline -->
  <text x="80" y="310" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#FFFFFF" letter-spacing="-2">India's Smartest</text>
  <text x="80" y="390" font-family="Arial, sans-serif" font-size="72" font-weight="900" fill="#FF6B35" letter-spacing="-2">Recruitment Marketplace</text>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" fill-opacity="0.5">Employers · Consultants · Candidates · Transparent Fees</text>

  <!-- Bottom bar -->
  <rect x="0" y="610" width="1200" height="20" fill="url(#bar)"/>

  <!-- Wordmark -->
  <text x="80" y="575" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#FF6B35" letter-spacing="3">TRICCI</text>
  <text x="80" y="598" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" fill-opacity="0.4" letter-spacing="1">tricci.in · India's Recruitment Marketplace</text>

  <!-- Domain badge -->
  <rect x="980" y="548" width="160" height="40" rx="8" fill="#FF6B35" fill-opacity="0.12"/>
  <rect x="980" y="548" width="160" height="40" rx="8" fill="none" stroke="#FF6B35" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1060" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="600" fill="#FF6B35">tricci.in</text>
</svg>
